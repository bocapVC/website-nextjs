# Sveltia CMS config for the admin panel at /admin. Every save is a commit to `branch`,
# which Vercel deploys. See docs/adr/0001-admin-panel-git-based-cms.md.
backend:
  name: github
  repo: bocapVC/website-nextjs
  branch: main
  # Served by src/app/api/admin/auth/route.ts (password form → scoped token).
  auth_endpoint: api/admin/auth

# Uploads land in the repo; later collections narrow this per field.
media_folder: public/uploads
public_folder: /uploads

locale: es

collections:
  - name: ajustes
    label: Ajustes generales
    files:
      - name: general
        label: Contacto y redes
        file: src/data/siteSettings.json
        fields:
          - name: email
            label: Correo institucional
            widget: string
            hint: Se muestra en el pie de página y en la página de Contacto.
            pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Ingresa un correo válido."]
          - name: linkedin
            label: LinkedIn
            widget: string
            required: false
            hint: Enlace completo a la página de BOCAP en LinkedIn. Si lo dejas vacío, no aparece en el pie de página.
            pattern: ['^https://([a-z]+\.)?linkedin\.com/', "Debe ser un enlace de LinkedIn que empiece con https://"]

  - name: inicio
    label: Página de inicio
    files:
      - name: junta-directiva
        label: Junta directiva
        file: src/data/juntaDirectiva.json
        fields:
          - name: members
            label: Miembros
            label_singular: Miembro
            widget: list
            hint: Se muestran en este orden en la página de inicio. Arrastra para reordenar.
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - name: photo
                label: Foto
                widget: image
                required: false
                hint: JPG o WebP, vertical 4:5 (por ejemplo 800 × 1000 px, mínimo 600 px de ancho), máximo 2 MB. Sin foto se muestran las iniciales.
                accept: image/jpeg,image/webp
                max_file_size: 2097152
                media_folder: /public/photos
                public_folder: /photos
              - { name: name, label: Nombre, widget: string }
              - { name: role, label: Cargo, widget: string, hint: "Ej.: Presidenta, Tesorero." }
              - { name: organization, label: Organización, widget: string, required: false }
              - { name: bio, label: Biografía, widget: text, required: false, hint: Una o dos oraciones. }
              - name: linkedin
                label: LinkedIn
                widget: string
                required: false
                hint: Enlace completo al perfil de LinkedIn.
                pattern: ['^https://([a-z]+\.)?linkedin\.com/', "Debe ser un enlace de LinkedIn que empiece con https://"]

  - name: ecosistema
    label: Ecosistema
    files:
      - name: directorio
        label: Directorio
        file: src/data/directorio.json
        fields:
          - name: entries
            label: Organizaciones
            label_singular: Organización
            widget: list
            hint: Se muestran en este orden en /ecosistema. Arrastra para reordenar. Las startups y los logos de la página de inicio no se editan aquí.
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - name: category
                label: Categoría
                widget: select
                hint: Define en qué pestaña aparece.
                options: [Fondos, Ángeles, Aceleradoras]
              - { name: type, label: Tipo, widget: string, required: false, hint: "Subtítulo breve. Ej.: Fondo de capital emprendedor." }
              - { name: description, label: Descripción, widget: text, required: false, hint: Una o dos oraciones. }
              - { name: location, label: Ubicación, widget: string, required: false, hint: "Ej.: Bolivia · LatAm." }
              - { name: focus, label: Enfoque, widget: list, required: false, hint: "Etiquetas cortas separadas por coma. Ej.: Impacto, Early-stage." }
              - name: website
                label: Sitio web
                widget: string
                required: false
                hint: Enlace completo, empezando con https://
                pattern: ['^https://', "Debe ser un enlace que empiece con https://"]
              - name: logo
                label: Logo
                widget: image
                hint: SVG o PNG con fondo transparente, máximo 1 MB.
                accept: image/svg+xml,image/png
                max_file_size: 1048576
                media_folder: /public/logos
                public_folder: /logos
