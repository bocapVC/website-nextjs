# Sveltia CMS config for the admin panel at /admin. Every save is a commit to `branch`,
# which Vercel deploys. See docs/adr/0001-admin-panel-git-based-cms.md.
backend:
  name: github
  repo: bocapVC/website-nextjs
  branch: main
  # Served by src/app/api/admin/auth/route.ts (password form → scoped token).
  auth_endpoint: api/admin/auth

# Uploads land in the repo; later collections narrow this per field.
media_folder: public/uploads
public_folder: /uploads

locale: es

# File names for new publications: "Guía de inversión" → guia-de-inversion.
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: ajustes
    label: Ajustes generales
    files:
      - name: general
        label: Contacto y redes
        file: src/data/siteSettings.json
        fields:
          - name: email
            label: Correo institucional
            widget: string
            hint: Se muestra en el pie de página y en la página de Contacto.
            pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Ingresa un correo válido."]
          - name: linkedin
            label: LinkedIn
            widget: string
            required: false
            hint: Enlace completo a la página de BOCAP en LinkedIn. Si lo dejas vacío, no aparece en el pie de página.
            pattern: ['^https://([a-z]+\.)?linkedin\.com/', "Debe ser un enlace de LinkedIn que empiece con https://"]

  - name: inicio
    label: Página de inicio
    files:
      - name: junta-directiva
        label: Junta directiva
        file: src/data/juntaDirectiva.json
        fields:
          - name: members
            label: Miembros
            label_singular: Miembro
            widget: list
            hint: Se muestran en este orden en la página de inicio. Arrastra para reordenar.
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - name: photo
                label: Foto
                widget: image
                required: false
                hint: JPG o WebP, vertical 4:5 (por ejemplo 800 × 1000 px, mínimo 600 px de ancho), máximo 2 MB. Sin foto se muestran las iniciales.
                accept: image/jpeg,image/webp
                max_file_size: 2097152
                media_folder: /public/photos
                public_folder: /photos
              - { name: name, label: Nombre, widget: string }
              - { name: role, label: Cargo, widget: string, hint: "Ej.: Presidenta, Tesorero." }
              - { name: organization, label: Organización, widget: string, required: false }
              - { name: bio, label: Biografía, widget: text, required: false, hint: Una o dos oraciones. }
              - name: linkedin
                label: LinkedIn
                widget: string
                required: false
                hint: Enlace completo al perfil de LinkedIn.
                pattern: ['^https://([a-z]+\.)?linkedin\.com/', "Debe ser un enlace de LinkedIn que empiece con https://"]

  - name: ecosistema
    label: Ecosistema
    files:
      - name: directorio
        label: Directorio
        file: src/data/directorio.json
        fields:
          - name: entries
            label: Organizaciones
            label_singular: Organización
            widget: list
            hint: Se muestran en este orden en /ecosistema. Arrastra para reordenar. Las startups y los logos de la página de inicio no se editan aquí.
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - { name: name, label: Nombre, widget: string }
              - name: category
                label: Categoría
                widget: select
                hint: Define en qué pestaña aparece.
                options: [Fondos, Ángeles, Aceleradoras]
              - { name: type, label: Tipo, widget: string, required: false, hint: "Subtítulo breve. Ej.: Fondo de capital emprendedor." }
              - { name: description, label: Descripción, widget: text, required: false, hint: Una o dos oraciones. }
              - { name: location, label: Ubicación, widget: string, required: false, hint: "Ej.: Bolivia · LatAm." }
              - { name: focus, label: Enfoque, widget: list, required: false, hint: "Etiquetas cortas separadas por coma. Ej.: Impacto, Early-stage." }
              - name: website
                label: Sitio web
                widget: string
                required: false
                hint: Enlace completo, empezando con https://
                pattern: ['^https://', "Debe ser un enlace que empiece con https://"]
              - name: logo
                label: Logo
                widget: image
                hint: SVG o PNG con fondo transparente, máximo 1 MB.
                accept: image/svg+xml,image/png
                max_file_size: 1048576
                media_folder: /public/logos
                public_folder: /logos

  # One JSON file per publication; the file name is the page URL: /publicaciones/<slug>.
  - name: publicaciones
    label: Publicaciones
    label_singular: Publicación
    folder: src/data/publicaciones
    format: json
    create: true
    slug:
      template: "{{slug}}"
      # Only while creating: renaming later would break links already shared.
      editable: [create]
      hint: "Dirección de la página: bocap.vc/publicaciones/… Se genera del título; no se puede cambiar después de guardar."
    summary: "{{title}} — {{category}} · {{date}}"
    sortable_fields: [date, title, category]
    # Images inserted in the body.
    media_folder: /public/uploads/publicaciones
    public_folder: /uploads/publicaciones
    fields:
      - { name: title, label: Título, widget: string }
      - name: date
        label: Fecha de publicación
        widget: datetime
        time_format: false
        hint: Se ordenan de la más reciente a la más antigua en /publicaciones.
      - name: category
        label: Categoría
        widget: select
        hint: Define en qué filtro aparece.
        options: [Artículo, Guía]
      - name: excerpt
        label: Resumen
        widget: text
        hint: Dos o tres oraciones. Se muestra en la tarjeta, al inicio de la página y en Google y redes sociales.
      - { name: author, label: Autor, widget: string, required: false }
      - name: body
        label: Texto
        widget: richtext
        required: false
        hint: "El artículo completo. Usa Título 2 y Título 3 para las secciones (el título de la página ya es el principal). Imágenes: JPG o WebP, idealmente de menos de 1 MB. Si lo dejas vacío, la página muestra solo el resumen y el archivo."
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
        media_folder: /public/uploads/publicaciones
        public_folder: /uploads/publicaciones
      # The file widget offers both an upload and a link (choose_url defaults to true);
      # max_file_size only applies to uploads.
      - name: file
        label: Archivo PDF o enlace
        widget: file
        required: false
        hint: Opcional. Sube un PDF (máximo 10 MB) o pega un enlace externo que empiece con https://
        accept: application/pdf
        max_file_size: 10485760
        media_folder: /public/articulos
        public_folder: /articulos
      - name: access
        label: Acceso al archivo
        widget: select
        default: open
        hint: "Protegido pide el correo del visitante antes de descargar el archivo. El texto de la página siempre es público, y los PDF subidos también son públicos en GitHub."
        options:
          - { label: Abierto, value: open }
          - { label: Protegido (requiere correo), value: protected }
